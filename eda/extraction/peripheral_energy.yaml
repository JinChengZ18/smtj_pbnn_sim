# EDA-extracted PPA peripheral energies for the smtj_pbnn_sim TechParams override (P6 interface).
# Only EDA-extracted entries replace the 28 nm placeholders; the others remain placeholders
# pending sky130 (P4). One-way injection: smtj_pbnn_sim is not modified. Units: joules.
e_smtj_write: 8.07e-13     # P2 write_mc_harness: channel+driver, Vamp=0.9V, Rdrv=10ohm (vs 0.783e-12 Ohmic-only)
e_smtj_read: 4.8e-14       # sky130 StrongARM SA decision energy (extracted device-C + routing est., sa_postlayout central ~48 fJ; range 23-74); replaces the 28nm 5fJ placeholder (errata R1)
e_dac_step: 3.4e-14        # sky130 R-string write-DAC code-set: ngspice analog core + sky130 stdcell-cap decode (eda/testbenches/dac_counter_energy.py)
e_count_inc: 1.9e-14       # sky130 popcount-counter increment: ~2 DFF toggles, sky130 stdcell-cap estimate (eda/testbenches/dac_counter_energy.py)
